; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Caja Control Riego
default_envs = DEVELOP_ESP32

; comun a todos los entornos ESP32:
[env]
; platform = espressif32 @ 6.10.0
platform = espressif32 @ 6.12.0
board = ESP32Dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_custom.csv  ; (1.8MB APP with OTA/256KB SPIFFS)
board_build.filesystem = littlefs
; change MCU frequency
;board_build.f_cpu = 240000000L
build_flags =
	-D FW_VERSION='"3.3-RC4"'	; version firmware
	-D ESP32
	-D DOMOTICZ		; Domoticz como SCD
    -D WEBSERVER	; para incluir webserver (+107KB DEVELOP / +75KB RELEASE)
	-D LOGTOFILE	; log de errores a fichero (+9KB DEVELOP / +6KB RELEASE)
    ;-D M3GRP	; opcion con boton multirriego + selector 3 grupos multirriego
	            ; por defecto 4GRP: 4 botones de grupos multirriego
	-Wno-sign-compare 
	;; las siguientes opciones reducen el tamaño del ejecutable 100K aprox. (pero pueden afectar a la depuración) 
	;-Wl,--gc-sections	;eliminar (garbage collect) secciones (funciones/datos) no referenciadas en el binario final.
	;-fno-exceptions	; desactiva el soporte de excepciones C++ (throw/catch) en tiempo de compilación/enlace
	;;-Os		; optimiza el código para tamaño (reduce el tamaño del binario) en lugar de para velocidad. (por defecto en release)
	;;-fdata-sections ;para que --gc-sections sea más efectivo (ya lo incluye por defecto)
	;;-ffunction-sections ;para que --gc-sections sea más efectivo (ya lo incluye por defecto)
	;;-fno-rtti	; desactiva la información de tiempo de ejecución de tipos (RTTI) en tiempo de compilación/enlace (ya lo incluye por defecto)
	;;-flto el linkaje falla con "plugin needed to handle lto object"
lib_deps = 
	bblanchon/ArduinoJson @ 7.1.0
	paulstoffregen/Time@^1.6.1
	https://github.com/tzapu/WiFiManager.git#v2.0.17
	hideakitai/DebugLog @ 0.8.4
	; hideakitai/DebugLog @ 0.8.3
	adafruit/Adafruit Unified Sensor
	adafruit/DHT sensor library

[env:DEVELOP_ESP32]
monitor_filters = esp32_exception_decoder
build_type = debug
build_flags = 
    ${env.build_flags}
    -D DEVELOP		; debug y traces activados
    -D TEMPLOCAL=DHT22	; para incluir temperatura del sensor DHT22 en el display de standby
	;-D MUTE		; sin sonidos	
	;-D DEMO		; modo DEMO (antiguo NONETWORK) sin activar riegos	
	-D noCHECK		; no hace encendido inicial de leds	
	;-D NOWIFI		; no intenta conexion wifi y modo DEMO
	;-D DEBUGloops
	-D clean_FS=0	; =1 borra file system
	;-D CORE_DEBUG_LEVEL=3
	;-D CORE_DEBUG_LEVEL=5
	;-DWM_DEBUG_LEVEL=4 -DDEBUG_ESP_CORE -DDEBUG_ESP_WIFI -DDEBUG_ESP_PORT=Serial -D CORE_DEBUG_LEVEL=3
	; -DWM_DEBUG_LEVEL=4 -DDEBUG_ESP_CORE -DDEBUG_ESP_WIFI -DCORE_DEBUG_LEVEL=5
	
[env:RELEASE_ESP32]
build_type = release
build_flags = 
    ${env.build_flags}
    -D RELEASE		; debug y traces desactivados (msg level ERROR siempre, WARN e INFO solo si se detecta serial conex.)	
    -D TEMPLOCAL=DHT22	; para incluir temperatura del sensor DHT22 en el display de standby
