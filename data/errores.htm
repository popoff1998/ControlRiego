<!DOCTYPE html>
<html>

<head>
  <title>Logs de Errores</title>
  <meta charset="UTF-8">
  <meta name='viewport' content='user-scalable=yes,initial-scale=1.0,width=device-width'>
  <link rel="stylesheet" href="/style_base.css">
  <link rel="stylesheet" href="/style_botones.css">
  <link rel="stylesheet" href="/style_tableFiles.css">
  <link rel="stylesheet" href="/style_datacard.css">
  <style>
    .button-update {
    padding: 10px 20px;
    font-size: 16px;
    background-color: #2196F3;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s;
    }
    .button-update:hover {
      background-color: #1976D2;
    }
    .banner {
    margin-bottom: 20px;
    border-radius: 5px;
    font-family: sans-serif;
    }
    .banner-warning {
        background-color: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
    }
    .banner-info {
        background-color: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
    }
    /* Oculta el encabezado temporalmente para evitar destello al mostrarlo si usa cards */
    @media (max-width: 600px) {thead { display: none !important; }}
  </style>
</head>

<body>
  <h1 style="margin-top: 20px;">Logs de errores</h1>
  <div style="text-align: center; margin-bottom: 20px;">
    <button id="btn-update" onclick="window.location.href='/errores.htm'" class="button-update">
      🔄 Actualizar y Sincronizar
    </button>
  </div>
  <div id="banner-warn" class="banner banner-warning" style="display: none;">
      ⚠️ <strong>Aviso:</strong> La grabación de mensajes <em>Warning</em> está activa. Esto puede llenar la memoria rápidamente; úselo solo para depuración temporal.
  </div>
  <div id="banner-off" class="banner banner-info" style="display: none;">
      ℹ️ El sistema de registro en fichero está <strong>desactivado</strong>. No se están generando nuevos registros de errores.
  </div>

  <table>
        <thead><tr><th>Nombre</th><th>Tamaño</th><th>Timestamp</th><th>Acción</th></tr></thead>
        <tbody id="logsTableBody">
        <!-- Rows will be dynamically added here -->
        </tbody>
    </table>

<script src="/funciones.js"></script>
<script>
    // lógica para mostrar o no los banners de aviso y boton de refresh:
    function updateUI(config) {
      const bannerWarn = document.getElementById('banner-warn');
      const bannerOff = document.getElementById('banner-off');
      const updateBtn = document.getElementById('btn-update');
      // ArduinoJson envía true/false (booleanos reales), no strings
      bannerWarn.style.display = config.logWarnFile ? 'block' : 'none';
      if (!config.logEnabled) {
        bannerOff.style.display = 'block';
        if (updateBtn) updateBtn.style.display = 'none';
      } else {
        bannerOff.style.display = 'none';
        if (updateBtn) updateBtn.style.display = 'inline-block';
      }
    }

    // 2. lógica de carga de la página
    window.addEventListener("load", async () => {
      try {
        // A. Pedimos la configuración general
        const config = await getServerConfig();
        // B. Actualizamos la interfaz
        updateUI(config);
        // C. Procesamos el path del fichero de errores para la tabla
        const fullPath = config.errorFile;
        const lastSlash = fullPath.lastIndexOf('/');
        const dir = fullPath.substring(0, lastSlash) || "/";
        const fileNameWithExt = fullPath.substring(lastSlash + 1);
        const filter = fileNameWithExt.split('.').slice(0, -1).join('.') || fileNameWithExt;
        // D. Pedimos la lista de archivos usando el filtro obtenido
        const fileData = await apiGetJson(`/api/list?dir=${encodeURIComponent(dir)}&file=${encodeURIComponent(filter)}`);
        populateTable(fileData, "logsTableBody");
      } catch (error) {
        console.error("Error cargando la página de logs:", error);
      }
    });
  </script>
</body>
</html>
