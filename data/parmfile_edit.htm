<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link Content-Type="text/css" href="/style_base.css" rel="stylesheet" />
    <title>Edicion parámetros</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            max-width: 50%;
        }

        table {
            width: 90%;
            border-collapse: collapse;
            margin: 0 auto;  /* Center the table */
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        input {
            width: 90%;
            padding: 5px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        p {
            margin: 0;
            padding: 0;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Editar parametros de configuracion BÁSICOS</h1>

    <h2>Botones</h2>
    <p>Nombre: max. 9 caracteres.</p>
    <p>Idx = 0 para zonas no asignadas.</p>
    <!-- <table style="table-layout: fixed; width: 100%;"> -->
    <table>
        <colgroup>
            <col style="width: 10%;">
            <col style="width: 20%;">
            <col style="width: 70%;">
        </colgroup>
        <thead>
            <tr>
                <th>Zona</th>
                <th>Idx</th>
                <th>Nombre</th>
            </tr>
        </thead>
        <tbody id="botonesTableBody">
            <!-- Rows will be dynamically added here -->
        </tbody>
    </table>

    <h2>Grupos</h2>
    <p>Descripción: max. 9 caracteres.</p>
    <p>Zonas: número zona separados por coma.</p>
    <table>
        <thead>
            <tr>
                <th>Grupo</th>
                <th>Descripción</th>
                <th>Zonas</th>
            </tr>
        </thead>
        <tbody id="gruposTableBody">
            <!-- Rows will be dynamically added here -->
        </tbody>
    </table>

    <h2>Domoticz</h2>
    <table>
        <thead>
            <tr>
                <th>Campo</th>
                <th>Valor</th>
            </tr>
        </thead>
        <tbody id="domoticzTableBody">
            <!-- Rows will be dynamically added here -->
        </tbody>
    </table>

    <h2>NTP Server</h2>
    <table>
        <thead>
            <tr>
                <th>Campo</th>
                <th>Valor</th>
            </tr>
        </thead>    
        <tbody id="ntpServerTableBody">
            <!-- Rows will be dynamically added here -->
        </tbody>    
    </table>    
        
        <div style="margin-top: 20px;">
            <button onclick="saveChanges()">Guardar Cambios</button>
        </div>
        
    <script>
        
        // Cargar las tablas al cargar la página
        window.addEventListener("load", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file') || 'config_parm.json'; // Default to 'config_parm.json' if no file is provided
            console.log(fileName); // Debería mostrar "sampleParm.json"

            //fetch(`/${fileName}`)
            fetch(`${fileName}`)
                .then(function (data) { return data.json(); })
                .then(data => {
                    // Asignar los datos originales al objeto global
                    window.originalJsonData = data;
                    // Cargar las tablas con los datos
                    loadTables(data);
                })
                .catch(error => console.error("Error fetching file data:", error));
        });
        
        // Función para cargar los datos en las tablas
        function loadTables(jsonData) {
            loadBotonesTable(jsonData.botones);
            loadGruposTable(jsonData.grupos);
            loadDomoticzTable(jsonData.domoticz);
            loadNtpServerTable(jsonData.ntpServer);
        }    

        function loadBotonesTable(botones) {
            const tableBody = document.getElementById("botonesTableBody");
            tableBody.innerHTML = ""; // Limpiar la tabla

            botones.forEach((boton, index) => {
                const row = document.createElement("tr");

                // Zona (no editable)
                const zonaCell = document.createElement("td");
                zonaCell.textContent = boton.zona;
                row.appendChild(zonaCell);

                // Campo idx (editable)
                const idxCell = document.createElement("td");
                const idxInput = document.createElement("input");
                idxInput.type = "number";
                idxInput.addEventListener("input", (event) => {
                    const value = event.target.value;
                    if (!/^\d{1,3}$/.test(value)) {
                        event.target.value = value.replace(/[^0-9]/g, "").slice(0, 3); // Limitar a 3 dígitos y solo números enteros
                    }
                    // Sombrear la celda si el valor es 0
                    if (event.target.value === "0") {
                        event.target.parentElement.style.backgroundColor = "#ffcccc"; // Color rojo claro
                    } else {
                        event.target.parentElement.style.backgroundColor = ""; // Quitar el sombreado
                    }
                });
                idxInput.min = "0";
                idxInput.max = "999";
                idxInput.value = boton.idx;
                if (boton.idx === 0) idxCell.style.backgroundColor = "#ffcccc"; // Color rojo claro
                idxInput.dataset.index = index;
                idxInput.dataset.field = "idx";
                idxCell.appendChild(idxInput);
                row.appendChild(idxCell);

                // Campo nombre (editable)
                const nombreCell = document.createElement("td");
                const nombreInput = document.createElement("input");
                nombreInput.type = "text";
                nombreInput.value = boton.nombre;
                nombreInput.dataset.index = index;
                nombreInput.dataset.field = "nombre";
                nombreInput.maxLength = 9;
                nombreCell.appendChild(nombreInput);
                row.appendChild(nombreCell);

                tableBody.appendChild(row);
            });    
        }    

        function loadGruposTable(grupos) {
            const tableBody = document.getElementById("gruposTableBody");
            tableBody.innerHTML = ""; // Limpiar la tabla

            grupos.forEach((grupo, index) => {
                const row = document.createElement("tr");

                // Grupo (no editable)
                const grupoCell = document.createElement("td");
                grupoCell.textContent = grupo.grupo;
                row.appendChild(grupoCell);

                // Campo descripción (editable)
                const descCell = document.createElement("td");
                const descInput = document.createElement("input");
                descInput.type = "text";
                descInput.value = grupo.desc;
                descInput.dataset.index = index;
                descInput.dataset.field = "desc";
                descInput.maxLength = 9;
                descCell.appendChild(descInput);
                row.appendChild(descCell);

                // Campo zonas (editable)
                const zonasCell = document.createElement("td");
                const zonasInput = document.createElement("input");
                zonasInput.type = "text";
                //* Comienzo validacion: Validar que solo se introduzcan números del 1 al 9, separados por comas
                zonasInput.addEventListener("input", (event) => {
                    const value = event.target.value;

                    // Permitir solo dígitos del 1 al 9 seguidos de comas
                    event.target.value = value
                        .replace(/[^1-9,]/g, "") // Eliminar caracteres no válidos
                        .replace(/,{2,}/g, ",") // Eliminar comas consecutivas
                        .replace(/(\d)(?=\d)/g, "$1,"); // Asegurar que haya una coma entre números consecutivos
                });
                zonasInput.addEventListener("blur", (event) => {
                    // Eliminar espacios en blanco y comas al principio o al final
                    event.target.value = event.target.value
                        .replace(/\s+/g, "") // Eliminar espacios en blanco
                        .replace(/^,|,$/g, ""); // Eliminar comas al principio o al final
                });
                zonasInput.value = grupo.zonas.join(","); // Inicializar el valor leido eliminando espacios en blanco
                zonasInput.maxLength = 17; // Limitar a 17 caracteres (9 zonas + 8 comas)
                //* Fin validacion 
                zonasInput.dataset.index = index;
                zonasInput.dataset.field = "zonas";
                zonasCell.appendChild(zonasInput);
                row.appendChild(zonasCell);

                tableBody.appendChild(row);
            });    
        }    

        function loadDomoticzTable(domoticz) {
            const tableBody = document.getElementById("domoticzTableBody");
            tableBody.innerHTML = ""; // Limpiar la tabla

            Object.keys(domoticz).forEach(key => {
                const row = document.createElement("tr");

                // Campo (no editable)
                const keyCell = document.createElement("td");
                keyCell.textContent = key;
                row.appendChild(keyCell);

                // Valor (editable)
                const valueCell = document.createElement("td");
                const valueInput = document.createElement("input");
                valueInput.type = "text";
                valueInput.value = domoticz[key];
                valueInput.dataset.field = key;
                valueCell.appendChild(valueInput);
                row.appendChild(valueCell);

                tableBody.appendChild(row);
            });    
        }    

        function loadNtpServerTable(ntpServer) {
            const tableBody = document.getElementById("ntpServerTableBody");
            tableBody.innerHTML = ""; // Limpiar la tabla

            const row = document.createElement("tr");

            // Campo (no editable)
            const keyCell = document.createElement("td");
            keyCell.textContent = "ntpServer";
            row.appendChild(keyCell);

            // Valor (editable)
            const valueCell = document.createElement("td");
            const valueInput = document.createElement("input");
            valueInput.type = "text";
            valueInput.value = ntpServer;
            valueInput.dataset.field = "ntpServer";
            valueCell.appendChild(valueInput);
            row.appendChild(valueCell);

            tableBody.appendChild(row);
        }    
        

        // Función para guardar los cambios en el servidor
        function saveChanges() {
            const jsonData = window.originalJsonData || {  // usar datos originales, si no inicializar un objeto vacío
                botones: [],
                grupos: [],
                domoticz: {},
                ntpServer: ""
            };

            // Recopilar datos de la tabla de botones
            const botonesInputs = document.querySelectorAll("#botonesTableBody input");
            botonesInputs.forEach(input => {
                const index = input.dataset.index;
                const field = input.dataset.field;

                if (!jsonData.botones[index]) {
                    jsonData.botones[index] = { zona: parseInt(input.closest("tr").children[0].textContent) };
                }
                jsonData.botones[index][field] = field === "idx" ? parseInt(input.value) : input.value;
            });

            // Recopilar datos de la tabla de grupos
            const gruposInputs = document.querySelectorAll("#gruposTableBody input");
            gruposInputs.forEach(input => {
                const index = input.dataset.index;
                const field = input.dataset.field;

                if (!jsonData.grupos[index]) {
                    jsonData.grupos[index] = { grupo: parseInt(input.closest("tr").children[0].textContent) };
                }
                if (field === "zonas") {
                    jsonData.grupos[index][field] = input.value.trim() === "" ? [] : input.value.split(",").map(Number);
                } else {
                    jsonData.grupos[index][field] = input.value;
                }
            });

            // Recopilar datos de la tabla de Domoticz
            const domoticzInputs = document.querySelectorAll("#domoticzTableBody input");
            domoticzInputs.forEach(input => {
                const field = input.dataset.field;
                jsonData.domoticz[field] = input.value;
            });

            // Recopilar datos del servidor NTP
            const ntpServerInput = document.querySelector("#ntpServerTableBody input");
            jsonData.ntpServer = ntpServerInput.value;

            // Enviar el JSON al servidor
            fetch('/save_config', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jsonData, null, 2) // Formatear con 2 espacios de indentación (pretty print)
                //body: JSON.stringify(jsonData) // sin formateo, una sola linea (mas compacto, menor tamaño pero menos legible)
            })
            .then(response => {
                if (response.ok) {
                    alert("Cambios guardados correctamente.");
                } else {
                    alert("Error al guardar los cambios.");
                }
            })
            .catch(error => {
                console.error("Error al guardar el archivo JSON:", error);
                alert("Ocurrió un error al intentar guardar los cambios.");
            });
        }
    </script>
</body>
</html>
