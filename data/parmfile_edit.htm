<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style_base.css">
    <link rel="stylesheet" href="/style_botones.css">
    <title>Edicion parámetros</title>
    <style>
        body {display: flex; flex-direction: column; max-width: 768px;}
        table {width: 90%; border-collapse: collapse; margin: 20px auto; box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);}
        th, td {border: 1px solid #ddd; padding: 8px; text-align: center;}
        th {background-color: #f4f4f4;}
        input {width: 90%; padding: 5px; box-sizing: border-box; border: 1px solid #cccccc;}
        p {margin: 0; padding: 0; font-size: 0.9em;}
        .highlight-zero {background-color: #ffcccc !important;}
    </style>
</head>
<body>
    <h1>Editar parámetros de configuración BÁSICOS</h1>
    
    <h2>Botones</h2>
    <p>Nombre: max. 9 caracteres.</p>
    <p>Idx = 0 para zonas no asignadas.</p>
    <table>
        <thead><tr><th>Zona</th><th>Idx</th><th>Nombre</th></tr></thead>
        <tbody id="botonesTableBody"></tbody>
    </table>

    <h2>Grupos</h2>
    <p>Descripción: max. 9 caracteres.</p>
    <p>Zonas: número zona separados por coma.</p>
    <table>
        <thead><tr><th>Grupo</th><th>Descripción</th><th>Zonas</th></tr></thead>
        <tbody id="gruposTableBody"></tbody>
    </table>

    <h2>Domoticz</h2>
    <table>
        <thead><tr><th>Campo</th><th>Valor</th></tr></thead>
        <tbody id="domoticzTableBody"></tbody>
    </table>

    <h2>NTP Server y TimeZone</h2>
    <table>
        <thead><tr><th>Campo</th><th>Valor</th></tr></thead>
        <tbody id="timeTableBody"></tbody>
    </table>

    <div class="button-group">
        <button onclick="saveChanges()" class="save-button"><b>Guardar Cambios y Salir</b></button>
    </div>

    <div class="button-group">
        <button type="button" onclick="editRaw()" class="secondary-button">Edit Full</button>
        <button type="button" onclick="processCancel()" class="secondary-button">Cancel</button>
    </div>

<script src="/funciones.js"></script>
<script>
let fileName = "", originalJsonData = {}, hasChanges = false;

window.addEventListener("load", async () => {
    const urlParams = new URLSearchParams(window.location.search);
    try {
        const config = await getServerConfig().catch(() => ({}));
        fileName = urlParams.get('file') || config.parmFile;
        const source = urlParams.get('source');
        const sessionData = sessionStorage.getItem('tempRawData');
        // 1. Prioridad: ¿Venimos de EditRaw con cambios pendientes?
        if (source === 'tempRawData' && sessionData) {
            console.log("Recuperando borrador de la sesión...");
            const editedData = JSON.parse(sessionData);
            // Cargamos solo el template para asegurar la estructura
            const template = await apiGetJson('/templateParm.json').catch(() => ({}));
            originalJsonData = mergeWithTemplate(editedData, template);
            hasChanges = true; // Marcamos que hay cambios respecto al archivo real
        } 
        // 2. Carga normal desde el servidor
        else {
            console.log("Cargando archivo desde el servidor:", fileName);
            const [template, editedData] = await Promise.all([
                apiGetJson('/templateParm.json').catch(() => ({})),
                apiGetJson(fileName).catch(() => ({}))
            ]);
            originalJsonData = mergeWithTemplate(editedData, template);
            hasChanges = false;
        }
        loadTables(originalJsonData);
        // Listeners para detectar cambios
        document.body.addEventListener("input", (e) => {
            if (e.target.tagName === "INPUT") {
                hasChanges = true;
                if (e.target.dataset.field === "idx") validateIdx(e.target);
                if (e.target.dataset.field === "zonas") validateZonas(e);
            }
        });
    } catch (e) {
        console.error("Error:", e); 
        alert("Error de carga: " + e.message);
    }
    window.onbeforeunload = () => hasChanges ? "¿Perder cambios?" : null;
});

// --- Utilidades de Interfaz ---
function validateIdx(el) {
    el.value = el.value.replace(/[^0-9]/g, "").slice(0, 3);
    el.closest("td").classList.toggle("highlight-zero", parseInt(el.value) === 0);
}

function validateZonas(e) {
    let v = e.target.value.replace(/[^1-9,]/g, "").replace(/,{2,}/g, ",");
    e.target.value = v.replace(/(\d)(?=\d)/g, "$1,");
}

function loadBotonesTable(botones) {
    const body = document.getElementById("botonesTableBody");
    body.innerHTML = "";
    botones.forEach((b, i) => {
        const row = body.insertRow();
        row.insertCell().innerHTML = `<span class="orla-v">${b.zona || i + 1}</span>`;
        
        const cIdx = row.insertCell();
        const iIdx = document.createElement("input");
        Object.assign(iIdx, { type: "number", value: b.idx || 0 });
        Object.assign(iIdx.dataset, { index: i, field: "idx" });
        cIdx.appendChild(iIdx);
        if (!b.idx) cIdx.className = "highlight-zero";

        const cNom = row.insertCell();
        const iNom = document.createElement("input");
        Object.assign(iNom, { type: "text", value: b.nombre || "", maxLength: 9 });
        Object.assign(iNom.dataset, { index: i, field: "nombre" });
        cNom.appendChild(iNom);
    });
}

function loadGruposTable(grupos) {
    const body = document.getElementById("gruposTableBody");
    body.innerHTML = "";
    grupos.forEach((g, i) => {
        const row = body.insertRow();
        row.insertCell().innerHTML = `<span class="orla-a">${g.grupo || i + 1}</span>`;
        
        const iDesc = document.createElement("input");
        Object.assign(iDesc, { type: "text", value: g.desc || "", maxLength: 9 });
        Object.assign(iDesc.dataset, { index: i, field: "desc" });
        row.insertCell().appendChild(iDesc);

        const iZon = document.createElement("input");
        Object.assign(iZon, { type: "text", maxLength: 17 });
        iZon.value = Array.isArray(g.zonas) ? g.zonas.join(",") : (g.zonas || "");
        Object.assign(iZon.dataset, { index: i, field: "zonas" });
        row.insertCell().appendChild(iZon);
    });
}

function loadTables(d) {
    loadBotonesTable(d.botones || []);
    loadGruposTable(d.grupos || []);
    loadSimpleTable(d.domoticz || {}, "domoticzTableBody");
    loadSimpleTable(d.time || {}, "timeTableBody");
}

// --- Persistencia ---

function collectChanges() {
    const d = JSON.parse(JSON.stringify(originalJsonData));
    
    document.querySelectorAll("#botonesTableBody input").forEach(i => {
        const v = i.dataset.field === 'idx' ? (parseInt(i.value) || 0) : i.value;
        d.botones[i.dataset.index][i.dataset.field] = v;
    });

    document.querySelectorAll("#gruposTableBody input").forEach(i => {
        const v = i.dataset.field === 'zonas' ? (i.value.split(",").map(Number).filter(n => n > 0)) : i.value;
        d.grupos[i.dataset.index][i.dataset.field] = v;
    });

    ["domoticz", "time"].forEach(key => {
        document.querySelectorAll(`#${key}TableBody input`).forEach(i => {
            d[key][i.dataset.field] = i.value;
        });
    });
    return d;
}

async function saveChanges() {
    try {
        // Pasamos el segundo parámetro como 'hasChanges' para que apiSaveConfig decida si es necesario reiniciar o no
        console.log("Guardando cambios...hasChanges=", hasChanges);
        await apiSaveConfig(collectChanges(), hasChanges, false);
    } catch (e) { /* Error gestionado en funciones.js */ }
}

function processCancel() {
    if (hasChanges && !confirm("Perder cambios?")) return;
    hasChanges = false;
    sessionStorage.removeItem('tempRawData');
    window.location.href = 'parmfile.htm';
}

function editRaw() {
    if (hasChanges) {
        // Solo si hay cambios, guardamos en sesión y pasamos el parámetro source
        sessionStorage.setItem('tempRawData', JSON.stringify(collectChanges()));
        hasChanges = false;
        window.open(`parmfile_editRaw.htm?file=${fileName}&source=tempRawData`, '_self');
    } else {
        // Si NO hay cambios, vamos directos. parmfile_editRaw cargará el archivo del servidor
        window.open(`parmfile_editRaw.htm?file=${fileName}`, '_self');
    }
}

/**
* Fusiona 'data' sobre 'template' (el template define la estructura y el orden).
* Prioriza los valores de 'data' y preserva claves extra de 'data' no presentes en 'template'.
*/
function mergeWithTemplate(data, template) {
    if (!data || typeof data !== 'object' || Array.isArray(data) !== Array.isArray(template)) {
        // 1. Devuelve el template clonado si no hay datos válidos.
        return JSON.parse(JSON.stringify(template));
    }
    // 2. Inicializar el resultado con data, ya que data puede tener campos extra.
    const merged = Array.isArray(data) ? [...data] : { ...data };
    // 3. Manejo de Arrays
    if (Array.isArray(template)) {
        if (template.length > 0 && typeof template[0] === 'object') {
            const idKey = Object.keys(template[0])[0];
            const dataMap = new Map();
            data.forEach(item => {
                if (item && item[idKey] !== undefined) {
                    dataMap.set(item[idKey], item);
                }
            });
            for (let i = 0; i < template.length; i++) {
                const templateItem = template[i];
                const templateId = templateItem[idKey];
                if (templateId !== undefined && dataMap.has(templateId)) {
                    const dataItem = dataMap.get(templateId);
                    merged[i] = mergeWithTemplate(dataItem, templateItem);
                } else {
                    merged[i] = JSON.parse(JSON.stringify(templateItem));
                }
            }
            merged.length = template.length; // Devolver solo el rango definido por el template (ej: 9 botones, 4 grupos)
            return merged;
        } else {
            return merged;
        }
    } else {
        // 4. Manejo de Objetos
        Object.keys(template).forEach(key => {
            const templateValue = template[key];
            const dataValue = data[key];
            if (!(key in data)) {
                merged[key] = JSON.parse(JSON.stringify(templateValue));
                return;
            }
            if (typeof templateValue === 'object' && templateValue !== null) {
                merged[key] = mergeWithTemplate(dataValue, templateValue);
            }
        });
        return merged;
    }
}
</script>
</body>
</html>
