<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style_base.css">
    <link rel="stylesheet" href="style_botones.css">
    <link rel="stylesheet" href="style_tableFiles.css">
    <title>System Info</title>
    <style>
    table {margin: 20px auto; background-color: #fff;}
    /* ---------------------------------------------------- */
    /* REGLA RESPONSIVA: MOBILE-FIRST (Por defecto: 70%/30%) */
    /* ---------------------------------------------------- */
    #sysInfoTable th:first-child, #sysInfoTable td:first-child {width: 70%;}
    #sysInfoTable th:last-child, #sysInfoTable td:last-child {width: 30%;}
    /* ---------------------------------------------------- */
    /* MEDIA QUERY: DESKTOP (Ancho mínimo de 768px: 50%/50%) */
    /* ---------------------------------------------------- */
    @media (min-width: 768px) {
        #sysInfoTable th:first-child, #sysInfoTable td:first-child {width: 50%;}
        #sysInfoTable th:last-child, #sysInfoTable td:last-child {width: 50%;}
    }
    </style>
</head>
<body>
<h1>System Information</h1>
<table id="sysInfoTable">
    <thead><tr><th>Nombre</th><th>Valor</th></tr></thead>
    <tbody id="sysInfoTableBody">
        <!-- Rows will be dynamically added here -->
    </tbody>
</table>
<script src="funciones.js"></script>
<script>
  window.addEventListener("DOMContentLoaded", async () => {
      const sysInfo = await fetchTableData('/api/sysinfo', 'sysInfoTableBody');
      if (sysInfo) loadSimpleTable(sysInfo, "sysInfoTableBody");
  });  
</script>
</body>
</html>
