<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Histórico de Riegos y Grupos</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style_base.css">
  <link rel="stylesheet" href="style_botones.css">
  <link rel="stylesheet" href="style_tableFiles.css">
<style>
  .table-container {max-width: 900px;margin: auto;}
  h2 {margin-top: 1em;margin-bottom: 0.5em;}
  .ft th, .ft td {text-align: center;}
  .info-flotante { 
    position: absolute; background: #333; color: #fff; padding: 8px; border-radius: 6px; 
    font-size: .85em; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.4); pointer-events: none; 
    line-height: 1.4; transition: opacity .4s ease; opacity: 0; visibility: hidden;}
  .info-flotante.show {opacity: 1;visibility: visible;}    
  .info-flotante b {color: #2ecc71;}
  @media (max-width: 600px) {
    .table-container {max-width: 100%;} table {font-size: 0.95em;} th,td {padding: 4px;} h2 {margin-top: 1em;}
  }
</style>
</head>
<body>
  <h1>Últimos riegos registrados</h1>
  <a href="/" class="back">← Home</a>
  <div class="table-container">
    <h2>Zonas</h2>
    <table class="ft">
      <thead><tr><th>Zona</th><th>Inicio</th><th>Final</th><th>Minutos</th><th>Histórico</th></tr></thead>
      <tbody id="tablaRiegos"></tbody>
    </table>
    <h2>Grupos</h2>
    <table class="ft">
      <thead><tr><th>Grupo</th><th>Inicio</th><th>Final</th><th>Minutos</th></tr></thead>
      <tbody id="tablaGrupos"></tbody>
    </table>
  </div>
<script src="funciones.js"></script>
<script>
let params = {};
window.addEventListener("load", async () => {
  const infoBox = document.createElement("div");
  infoBox.className = "info-flotante";
  document.body.appendChild(infoBox);

  window.showInfo = (e, pos, isZona) => {
    if (!params.botones || !params.grupos) return;
    clearTimeout(infoBox.timer);
    infoBox.innerHTML = isZona 
      ? `<b>${params.botones[pos]?.nombre || 'Zona'}</b>`
      : `<b>${params.grupos[pos]?.desc || 'Grupo'}</b><br>Zonas: ${params.grupos[pos]?.zonas?.join(", ")}`;
    infoBox.style.left = `${e.pageX + 20}px`;
    infoBox.style.top = `${e.pageY - 45}px`;
    infoBox.classList.add("show");
    const hide = () => infoBox.classList.remove("show");
    e.target.onmouseleave = hide;
    infoBox.timer = setTimeout(hide, 2500);
  };

  try {
    const config = await getServerConfig();
    if (!config.lastRiegos || !config.lastGrupos) throw new Error(MSG_ERR_CONFIG);
    
    let riegosRes, gruposRes;
    [riegosRes, gruposRes, params] = await Promise.all([
      fetchTableData(config.lastRiegos, 'tablaRiegos', 5),
      fetchTableData(config.lastGrupos, 'tablaGrupos', 4),
      apiGetJson(config.parmFile).catch(() => ({}))
    ]);

    const renderTable = (idBody, list, type) => {
      const isZona = type === 'zona';
      document.getElementById(idBody).innerHTML = list.map((item, pos) => {
        const btn = params.botones?.[pos];
        const idx = btn?.idx || 0;
        const nombre = btn?.nombre || `N/A`;
        const zona = `Zona ${pos + 1}`;
        return `<tr>
          <td><span class="${isZona ? 'orla-v' : 'orla-a'} clicable" onclick="showInfo(event,${pos},${isZona})">${pos + 1}</span></td>
          <td>${formatDateLocal(item.inicio)}</td>
          <td>${formatDateLocal(item.final)}</td>
          <td>${item.total > 0 ? formatMinutes(item.total) : ""}</td>
          ${isZona ? `<td><button class="btn-log" onclick="location.href='showLog.htm?idx=${idx}&name=${encodeURIComponent(nombre)}&zona=${encodeURIComponent(zona)}'">LOG</button></td>` : ''}
        </tr>`;
      }).join('');
    };

    if (riegosRes?.lastRiegos) renderTable('tablaRiegos', riegosRes.lastRiegos, 'zona');
    if (gruposRes?.lastGrupos) renderTable('tablaGrupos', gruposRes.lastGrupos, 'grupo');
  } catch (error) { alert(error.message); }
});
</script>
</body>
</html>
