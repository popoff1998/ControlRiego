<!DOCTYPE html>
<html lang="es">

<head>
  <title>HomePage</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>.warn-icon{display:none;color:#ff9800;cursor:help;position:absolute;margin-left:-35px;font-weight:bold;}</style>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link type="text/css" href="style_base.css" rel="stylesheet" />
</head>

<body>
  
  <h1>Ardomo Webserver Homepage</h1>
  <img src="logo_Ardomo.png" class="logo">

  <div class="menu-big">
      <ul class="lista-alineada">
        <li><a href="parmfile.htm">PARÁMETROS</a> <span class="descripcion">- Gestionar el fichero de configuración</span></li>
        <li><a href="lastRiegos.htm">RIEGOS</a> <span class="descripcion">- Histórico de Riegos y Grupos</span></li>
        <li><a href="errores.htm">ERRORES</a> <span class="descripcion">- Logs de errores</span></li>
        <li>
          <a href="#" onclick="return dispositivoRestart(false);">RESTART</a> <!-- si se cancela, no se activa el flag de reinicio pendiente -->
          <span id="warnRestart" class="warn-icon" title="Reinicio requerido.Se forzará al cerrar el webserver">⚠️</span>
          <span class="descripcion">- Reiniciar dispositivo para aplicar cambios</span>
        </li>
      </ul>
    
      <p>Otras opciones avanzadas en:</p>
      <ul class="lista-alineada">
        <li><a href="advanced.htm">MANTENIMIENTO</a> <span class="descripcion">- Miscelanea y pruebas</span></li>
      </ul>
  </div>

 <script src="funciones.js"></script>
  <script>
    window.addEventListener("load", () => {
      // Mostrar advertencia si hay cambios pendientes
      if (sessionStorage.getItem('needsRestart') === 'true') {document.getElementById('warnRestart').style.display = 'inline';}
      // Precargamos la configuración para que las siguientes páginas sean instantáneas
      getServerConfig()
      .then(config => {
        if (config && Object.keys(config).length > 0) { console.log("Configuración precargada y lista.");
        } else { alert("No se pudo obtener la configuración del servidor. Algunas paginas no funcionaran."); }
      })
      .catch(err => console.error("Error en precarga:", err));
    });
  </script>
</body>
</html>
