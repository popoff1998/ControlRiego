<!DOCTYPE HTML>
<html lang="es">
<head>
  <title>Edit Raw</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style_base.css">
  <link rel="stylesheet" href="style_botones.css">
  <style>
    fieldset {width: 90%; max-width: 800px; margin: 1em auto; background:#f7f7f7; padding: 20px;}
    textarea {width: 100%; height: 700px; padding: 12px 20px; box-sizing: border-box; border: 2px solid #ccc; border-radius: 4px; margin-top: 15px;}
    .button-group { margin-top: 20px; }
    @media (max-width: 768px) {textarea {height: 480px;} }
  </style>
</head>
<body>
  <h1>Edición libre del fichero de parámetros</h1>
  <a href="/" class="back">← Home</a>
  <fieldset>
    <legend style="color:red;">⚠️ ¡ATENCIÓN! Edición sin verificaciones lógicas</legend>
    <form id="edit_form_id"><textarea name="edit_textarea"></textarea></form>
    <div class="button-group">
      <button type="submit" form="edit_form_id" class="save-button">Salvar y salir</button>
      <button type="button" id="cancel" class="secondary-button">Descartar y volver</button>
    </div>
  </fieldset>
  <dialog id="Warning">
    <p>⚠️ <b>EDICIÓN LIBRE</b> ⚠️</p>
    <p>Solo se verifica la sintaxis JSON, NO la validez de los parámetros.</p>
    <p>Se recomienda usar el menú de configuración asistido.</p>        
    <button id="cerrarBtn">Entendido</button>
  </dialog>
  <script src="funciones.js"></script>
  <script>
  const textarea = document.getElementsByName('edit_textarea')[0];
  const urlParams = new URLSearchParams(window.location.search);
  const fileName = urlParams.get('file');
  let originalContent = "", hasChanges = false;

  window.addEventListener("load", () => {
    const sessionData = sessionStorage.getItem('tempRawData');
    if (!sessionData) {
      alert("Error: Acceso denegado. No hay sesión de edición activa.");
      return window.location.href = `/`;
    }
    textarea.value = JSON.stringify(JSON.parse(sessionData), null, 2);
    originalContent = textarea.value;
    const dialogo = document.getElementById('Warning');
    dialogo.showModal();
    document.getElementById('cerrarBtn').onclick = () => dialogo.close();
    textarea.oninput = () => hasChanges = (textarea.value !== originalContent);
  });

  window.onbeforeunload = () => hasChanges ? "¿Cambios sin guardar?" : null;

  document.getElementById('cancel').onclick = () => {
    if (textarea.value === originalContent || confirm("¿Descartar cambios y volver?")) {
      hasChanges = false;
      // Volvemos a parmfile_edit pasando el estado heredado de la URL
      const inheritedChanges = urlParams.get('hadChanges') === 'true';
      window.location.href = `parmfile_edit.htm?file=${fileName}&source=tempRawData&hasChanges=${inheritedChanges}`;      
    }
  };

  document.getElementById('edit_form_id').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const userRawJson = validarJsonParametros(textarea.value);
      const huboCambios = textarea.value !== originalContent;
      const veniaConCambios = urlParams.get('hadChanges') === 'true';
      const requiereEscritura = huboCambios || veniaConCambios;
      if (!requiereEscritura) {
        alert("Sin cambios que guardar.");
        return clearSessionAndLeave();
      }
      let out = { fileType: CLIENT_FILE_TYPE, version: CLIENT_VERSION, SCDtype: CLIENT_SCD_TYPE };
      delete userRawJson.fileType; delete userRawJson.version; delete userRawJson.SCDtype;
      hasChanges = false; 
      await apiSaveConfig(Object.assign(out, userRawJson));
    } catch (err) { alert("ERROR:\n" + err.message); }
  };
  </script>
</body>
</html>
