<!DOCTYPE html>
<html lang="es">
<head>
  <title>Files</title>
  <meta charset="UTF-8">
  <meta name='viewport' content='user-scalable=yes,initial-scale=1.0,width=device-width'>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style_base.css">
  <link rel="stylesheet" href="style_botones.css">
  <link rel="stylesheet" href="style_tableFiles.css">
  <link rel="stylesheet" href="style_datacard.css">
  <style>
    /* Oculta el encabezado temporalmente para evitar destello al mostrarlo si usa cards */
    @media (max-width: 600px) {thead { display: none !important; }}
  </style>
</head>

<body>
  <h1 style="margin-top: 20px;">Files on server</h1>
  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 20px; margin-bottom: 20px;">
    <h3 style="margin: 0;">Files on <span id="currentDir" style="color: #135a8a;">/</span></h3>
    <div style="font-size: 12px; color: #666;">
      Free space: <span id="freeSp" style="font-weight: bold; color: #135a8a;">--</span>
    </div>
  </div>
  <table>
      <thead><tr><th>Filepath</th><th>Size</th><th>Timestamp</th><th>Action</th></tr></thead>
        <tbody id="filesTableBody">
        <!-- Rows will be dynamically added here -->
        </tbody>
  </table>

<script src="funciones.js"></script>
<script>
// Fetch and display the data when the page loads
window.addEventListener("load", async () => {
  const queryParams = new URLSearchParams(window.location.search);
  const dir = queryParams.get("dir") || "/";
  document.getElementById("currentDir").textContent = dir;
  try {
      const [data, config] = await Promise.all([
          apiGetJson(`/api/list?dir=${encodeURIComponent(dir)}`),
          getServerConfig(true) // con refresh
      ]);
      populateTable(data, "filesTableBody");
      UI_actualizarEspacioLibre(config, 'freeSp');

  } catch (error) {
      console.error("Error cargando datos de archivos:", error);
  }
});
  </script>
</body>

</html>
