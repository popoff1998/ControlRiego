  <!-- 
   Esta página, parmfile_editRaw.htm, permite editar directamente el contenido 
    de un archivo JSON de configuración en formato de texto sin realizar ninguna validación. 
   Está diseñada para usuarios avanzados que necesitan modificar manualmente 
    los parámetros de configuración del sistema.
  -->
<!DOCTYPE HTML>
<html>
  <head>
    <title>Edit Raw</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="/style_base.css" rel="stylesheet" />
    <style>
      fieldset {width: 90%; max-width: 800px; margin: 1em auto; background-color: #f7f7f7;}
      textarea {width: 100%; height: 700px; padding: 12px 20px; box-sizing: border-box; border: 2px solid #ccc; border-radius: 4px;}
      button {width: 100%; padding: 10px; font-size: 1em; margin: 5px 0;}
      table {width: 100%; background-color: #dddddd;}
      td, th {text-align: center; padding: 10px;}
      
      @media (max-width: 768px) {
        textarea {height: 480px;}
        button {font-size: 0.9em;}
      }
    </style>
  </head>
  <body>
      <h1>Edicion libre del fichero de parametros</h1>
      <fieldset>
        <legend style="color:red;">ATENCION! no se realiza ninguna verificacion</legend>
        <div id="spacer_20"></div>
        <table><tr><td colspan="2">
        <form name="edit_file">
          <textarea name="edit_textarea"></textarea>
          <div id="spacer_20"></div>
        </td></tr><tr><td>
          <button type="submit" id="submit" class="save-button">Save</button>
        </form>
        </td><td>
        <button id="cancel" onclick="window.location.href='/parmfile_edit.htm';" class="secondary-button">Cancel</button>
        </td></tr></table>
        <div id="spacer_50"></div>
      </fieldset>
      
      <iframe style="display:none" name="self_page"></iframe>
    <script src="/funciones.js"></script>
    <script>
        // Obtener el nombre del archivo y el parámetro de fuente desde la URL
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');
        const source = urlParams.get('source');
        console.log(fileName);
        const textarea = document.querySelector('textarea[name="edit_textarea"]');
        // --- Lógica de Carga de Contenido ---
        if (fileName) {
            const tempRawData = sessionStorage.getItem('tempRawData');
            if (source === 'tempRawData' && tempRawData) {
                // Caso 1: Cargar desde sessionStorage (datos editados no guardados)
                try {
                    const data = JSON.parse(tempRawData);
                    textarea.value = JSON.stringify(data, null, 2); 
                    console.log("Datos cargados desde sessionStorage.");
                    // Limpiar sessionStorage inmediatamente después de usar
                    sessionStorage.removeItem('tempRawData'); 
                } catch (error) {
                    console.error("Error al parsear datos de sessionStorage:", error);
                    // Si falla el parseo, caemos al fetch del servidor como respaldo.
                    loadFromServer(fileName, textarea); 
                }
            } else {
                // Caso 2: Cargar desde el servidor (comportamiento normal)
                loadFromServer(fileName, textarea);
            }
        } else alert("No se especificó ningún archivo en la URL.");
        
        /** Función auxiliar para cargar datos del servidor */
        function loadFromServer(fileName, textarea) {
            apiGetJson(fileName)
                .then(data => {
                    textarea.value = JSON.stringify(data, null, 2); // Asigna la cadena formateada
                })
                .catch(error => {
                    console.error("Error al cargar el archivo:", error);
                    textarea.value = `Error al cargar el archivo: ${error.message || error}`; 
                });
        }

        // Manejar el evento submit del formulario
        const form = document.querySelector('form[name="edit_file"]');
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const content = textarea.value;
          try {
              JSON.parse(content); // validacion de la sintaxis JSON
          } catch (e) {
              console.error("Error de sintaxis JSON:", e);
              alert(`Error de sintaxis JSON: ${e.message}. Por favor, corrige el contenido antes de guardar.`);
              return; // Detiene el envío del formulario si falla la validación
          }
          fetch('/api/save_config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: content
          })
          .then(response => {
            if (response.ok) {
              alert("Archivo guardado correctamente.");
              window.location.href = `/parmfile_edit.htm?file=${fileName}`; 
            } else {
              response.text().then(text => alert(`Error al guardar el archivo: ${text}`));
            }
          })
          .catch(error => {
            console.error("Error al guardar el archivo:", error);
            alert("No se pudo guardar el archivo.");
          });
        });
    </script>
</body>
</html>
