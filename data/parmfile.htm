<!-- 
   Esta página, parmfile.htm, permite gestionar el fichero de parámetros de la CCR.
   Cargarlo desde el PC, crear uno nuevo o restaurar desde el fichero de backup.
   Ademas, ver, editar, descargar o borrar el fichero actual. 
 --> 

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Parmfile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style_base.css">
    <link rel="stylesheet" href="/style_botones.css">
    <link rel="stylesheet" href="/style_tableFiles.css">
    <link rel="stylesheet" href="/style_datacard.css">
</head>

<style>
    .container { display: flex; flex-direction: column; align-items: center; gap: 20px; margin: 25px auto 50px; }
    .button-group button { flex: 1 1 auto; max-width: 120px; min-width: 80px; padding: 10px 12px; }
    .button-import, .button-new { padding: 12px 17px; font-size: 18px; min-width: 100px; color: #fff; }
    .button-import { background-color: #1e9a31; }
    .button-restore { background-color: #780320; color: #fff; }
    .button-restore:hover { background-color: #930628; color: #fff; }
    @media (max-width: 768px) { button.back-button { padding: 6px 10px; font-size: 0.9rem; } }
    form { display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; }
    input[type="file"] { flex: 1 1 auto; max-width: 350px; }
    .restart-banner { display: none; background-color: #ff9800; color: white; padding: 15px; margin: 10px auto; width: 90%;
         max-width: 600px; border-radius: 8px; text-align: center; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .restart-banner button { margin-left: 15px; padding: 5px 10px; background-color: white; color: #ff9800; border: none;
         border-radius: 4px; cursor: pointer; }
</style>
  
<body>
    <h1 style="margin-top: 20px;">Gestión fichero de parámetros</h1>
    <a href="/index.htm" class="back">← Home</a>
    <div id="restartBanner" class="restart-banner">⚠️ Hay cambios guardados pendientes de aplicar. 
        <button onclick="sessionStorage.removeItem('needsRestart'); window.location.href='/api/restart'">Reiniciar ahora</button>
    </div>
    <div class="container">
        <h2>Carga de parámetros a la CCR:</h2>
        <form id="uploadForm" enctype="multipart/form-data" style="white-space: nowrap" >
            <input type="file" id="fileInput" name="file" accept=".json" required>
            <button type="button" id="btnImport" class="button-flex button-import" onclick="handleImportClick()">Import</button>
            <button type="button" class="button-flex button-new" onclick="openNewFile()">New</button>
        </form>
    </div>
    <h3>Fichero de Parámetros en la CCR: </h3>
    <table>
        <thead><tr><th>Nombre</th><th>Tamaño</th><th>Timestamp</th><th>Acción</th></tr></thead>
        <tbody id="parmTableBody"></tbody>
    </table>
    
    <h3>Fichero de Backup en la CCR:</h3>
    <table>
        <thead><tr><th>Nombre</th><th>Tamaño</th><th>Timestamp</th><th>Acción</th></tr></thead>
        <tbody id="backupTableBody"></tbody>
    </table>
    
<script src="/funciones.js"></script>
<script>
// Variables de configuración
const MAX_PARMFILE = 4 * 1024;    // Tamaño máximo para un JSON de parámetros
const PARM_FILE_TYPES = ['.json']; // Solo se acepta la extensión .json
let currentParmFile = "";
let currentBackupFile = "";

window.addEventListener("load", async () => {
    // Comprobar si hay reinicio pendiente
    if (sessionStorage.getItem('needsRestart') === 'true') {
        document.getElementById('restartBanner').style.display = 'block';
    }
    try {
        // 1. Obtener nombres de ficheros desde el servidor
        const config = await getServerConfig();
        currentParmFile = config.parmFile;
        currentBackupFile = config.backupFile;
        // 2. Cargar listas de archivos en las tablas
        const parmData = await apiGetJson('/api/list?file=' + encodeURIComponent(currentParmFile));
        populateTable(parmData, "parmTableBody");
        const backupData = await apiGetJson('/api/list?file=' + encodeURIComponent(currentBackupFile));
        populateTable(backupData, "backupTableBody");
    } catch (error) {
        console.error("Error inicializando listas de ficheros:", error);
    }
});

// * Utility para leer un archivo como texto usando Promesas
const leerArchivoAsText = (file) => {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = (e) => reject(new Error("Error al leer el archivo"));
        reader.readAsText(file);
    });
};

// * Sube fichero de parámetros al servidor con validaciones
async function handleImportClick() {
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    if (!file) return alert("Seleccione un archivo.");
    if (!validFileType(file, PARM_FILE_TYPES)) return alert(`Error: Tipo de fichero no válido. Debe ser ${PARM_FILE_TYPES.join(', ')}.`);
    if (file.size > MAX_PARMFILE) return alert(`Error: El fichero excede el tamaño máximo permitido (${returnFileSize(MAX_PARMFILE)}).`);
    try {
        const jsonString = await leerArchivoAsText(file);
        validarJsonCompleto(jsonString);
        console.log("JSON válido.");
            if (confirm("¡Los parámetros actuales serán sustituidos por los de " + file.name + " ! ¿Continuar?")) {
            await apiUploadParmFile(file);
        }
    } catch (error) {
        alert("Error: " + error.message);
        console.error("Fallo en el proceso:", error);
    }
}

async function apiUploadParmFile(file) {
    const formData = new FormData();
    // IMPORTANTE: Usamos currentParmFile para que el servidor sepa qué archivo sobreescribir
    formData.append('file', file, currentParmFile); 
    const btn = document.getElementById('btnImport');
    btn.disabled = true; 
    try {
        const response = await fetch('/', { method: 'POST', body: formData });
        if (response.ok) { 
            await fetch('/api/setrestart'); 
            if (confirm("Archivo subido con éxito. ¿Desea reiniciar el sistema?")) {
                sessionStorage.removeItem('serverConfig'); // Limpiamos para que al volver cargue lo nuevo
                sessionStorage.removeItem('needsRestart');
                window.location.href='/api/restart'; 
            } else {
                sessionStorage.setItem('needsRestart', 'true');
                location.reload();
            }   
        } else { 
            const errorText = await response.text();
            alert("Error al subir: " + errorText); 
        }
    } catch (error) {
        alert("Ocurrió un error de red al subir el archivo.");
        console.error("Error al subir el archivo:", error);
    } finally {
        btn.disabled = false;
    }
}

function openNewFile() {
    if (confirm("¿Desea crear un nuevo archivo de parámetros? (los actuales serán borrados)")) {
        window.open('parmfile_edit.htm?file=templateParm.json', '_self');
    }
}
</script>
</body>
</html>
