<!-- 
   Esta página, parmfile.htm, permite gestionar el fichero de parámetros de la CCR.
   Cargarlo desde el PC, crear uno nuevo o restaurar desde el fichero de backup.
   Ademas, ver, editar, descargar o borrar el fichero actual. 
 --> 

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Parmfile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style_base.css">
    <link rel="stylesheet" href="/style_botones.css">
    <link rel="stylesheet" href="/style_tableFiles.css">
    <link rel="stylesheet" href="/style_datacard.css">
</head>

<style>

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin: 25px auto 50px;
    }    
    
    /* modificaciones/añadidos al boton base para botones específicos de esta página */
    .button-group button { /*  adicional al button base */ 
        flex: 1 1 auto;
        max-width: 120px;
        min-width: 80px;
        padding: 10px 12px
    }
    .button-import {
        padding: 12px 17px;
        background-color: #1e9a31;
        font-size: 18px;
        min-width: 100px;
        color: #fff;
    }
    .button-new {
        padding: 12px 17px;
        font-size: 18px;
        min-width: 100px;
        color: #fff;
    }
    .button-restore {
        background-color: #780320;
        color: #fff;
    }
    .button-restore:hover {
        background-color: #930628;
        color: #fff;
    }

    @media (max-width: 768px) {
        button.back-button { padding: 6px 10px; font-size: 0.9rem; }
    }    

    form {
        display: flex;
        flex-wrap: wrap;
        gap: 25px;
        justify-content: center;
    }    

    input[type="file"] {
        flex: 1 1 auto;
        max-width: 350px;
    }    

</style>  
  
<body>
    <h1 style="margin-top: 20px;">Gestión fichero de parámetros</h1>

    <button class="back-button" onclick="window.location.href='/index.htm'">← Volver</button>

    <div class="container">
        <h2>Carga de parámetros a la CCR:</h2>
        <form id="uploadForm" enctype="multipart/form-data" style="white-space: nowrap" >
            <input type="file" id="fileInput" name="file" accept=".json" required>
            <button type="button" id="btnImport" class="button-flex button-import" onclick="uploadFile()">Import</button>
            <button type="button" class="button-flex button-new" onclick="openNewFile()">New</button>
        </form>
    </div>
    <h3>Fichero de Parámetros en la CCR: </h3>
    <table style="margin: 0 auto;">
        <thead><tr><th>Nombre</th><th>Tamaño</th><th>Timestamp</th><th>Acción</th></tr></thead>
        <tbody id="parmTableBody"></tbody>
    </table>
    
    <h3>Fichero de Backup en la CCR:</h3>
    <table style="margin: 0 auto;">
        <thead><tr><th>Nombre</th><th>Tamaño</th><th>Timestamp</th><th>Acción</th></tr></thead>
        <tbody id="backupTableBody"></tbody>
    </table>
    
    <script src="/funciones.js"></script>
    <script>
    // Variables de configuración
    const MAX_PARMFILE = 4 * 1024;    // Tamaño máximo para un JSON de parámetros
    const PARM_FILE_TYPES = ['.json']; // Solo se acepta la extensión .json

    window.addEventListener("load", () => {
        window.requestAnimationFrame(() => {
            if (typeof apiGetJson !== 'undefined') { // Asegurar que apiGetJson está definido si es una función externa
                apiGetJson('/api/list?file=' + encodeURIComponent('%PARMFILE%'))
                    .then(data => {
                        if (typeof populateTable !== 'undefined') populateTable(data, "parmTableBody");
                    })
                    .catch(error => console.error("Error fetching parm file data:", error));
                apiGetJson('/api/list?file=' + encodeURIComponent('%BACKUPFILE%'))
                    .then(data => {
                        if (typeof populateTable !== 'undefined') populateTable(data, "backupTableBody");
                    })
                    .catch(error => console.error("Error fetching backup file data:", error));
            }
        });
    });

    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        let statusMessage = "";
        // 1. VALIDACIONES BÁSICAS (TIPO Y TAMAÑO)
        if (!file) { 
            alert("Por favor, seleccione un archivo para subir."); 
            return; 
        }
        if (!validFileType(file, PARM_FILE_TYPES)) {
            statusMessage = `Error: Tipo de fichero no válido. Debe ser ${PARM_FILE_TYPES.join(', ')}.`;
            alert(statusMessage);
            return;
        }
        if (file.size > MAX_PARMFILE) {
            statusMessage = `Error: El fichero excede el tamaño máximo permitido (${returnFileSize(MAX_PARMFILE)}).`;
            alert(statusMessage);
            return;
        }
        // 2. LECTURA Y VALIDACIÓN DE CONTENIDO (ASÍNCRONA)
        const reader = new FileReader();
        reader.onload = async function(e) {
            const jsonString = e.target.result;
            let jsonObject;
            try {
                jsonObject = validarSintaxisJson(jsonString); 
                validarEstructura(jsonObject); 
                console.log("JSON válido: sintaxis y estructura correctas.");
                // 3. SUBIDA AL SERVIDOR
                if (confirm("¡Los parámetros actuales serán sustituidos por los de " + file.name + " ! ¿Continuar?")) {
                    await subirArchivoAlServidor(file);
                }
            } catch (validationError) {
                // Captura los errores lanzados por validarSintaxisJson o validarEstructura
                alert("Error de validación:\n" + validationError.message);
                console.error("Fallo la validación del JSON en el cliente:", validationError);
            }
        };
        // Si la lectura del fichero falla
        reader.onerror = function() {
            alert("Error al leer el archivo. Intente de nuevo.");
        };
        // Iniciar la lectura del archivo
        reader.readAsText(file);
    }


    // Función auxiliar para encapsular la lógica de subida y manejo de respuesta
    async function subirArchivoAlServidor(file) {
        const formData = new FormData();
        formData.append('file', file, '%PARMFILE%'); 
        document.getElementById('btnImport').disabled = true; 
        try {
            const response = await fetch('/', {
                method: 'POST',
                body: formData
            });
            if (response.ok) { 
                await fetch('/api/setrestart'); // Marca que se requiere reinicio
                if (confirm("Archivo validado correctamente y subido. ¿Desea reiniciar el sistema para aplicar los cambios?")) {
                    window.location.href='/api/restart'; 
                } else location.reload(); 
                return;
            } else { 
                const errorText = await response.text();
                alert("Error al subir el archivo (HTTP " + response.status + "): " + errorText); 
            }
        } catch (error) {
            alert("Ocurrió un error de red al subir el archivo.");
            console.error("Error al subir el archivo:", error);
        } finally {
            // SIEMPRE se ejecuta para re-habilitar el botón
            document.getElementById('btnImport').disabled = false;
        }
    }

    function openNewFile() {
            if (confirm("¿Desea crear un nuevo archivo de parámetros? (los actuales serán borrados)")) {
                window.open('parmfile_edit.htm?file=templateParm.json', '_self');
            }
    }

    </script>
</body>
</html>
