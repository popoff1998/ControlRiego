<!-- 
   Esta página, parmfile.htm, permite gestionar el fichero de parámetros de la CCR.
   Cargarlo desde el PC, crear uno nuevo o restaurar desde el fichero de backup.
   Ademas, ver, editar, descargar o borrar el fichero actual. 
 --> 

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Parmfile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" href="/style_base.css" rel="stylesheet" />
    <link type="text/css" href="/style_tableFiles.css" rel="stylesheet" />
</head>

<style>

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin: 25px auto 50px;
    }    
    
    /* modificaciones/añadidos al estilo base para botones específicos de esta página */
    button {   /* adicional al button base */
        flex: 1 1 auto;
        max-width: 120px;
        padding: 10px 12px
    }
    .button-import {
        padding: 12px 17px;
        background-color: #1e9a31;
        font-size: 18px;
        color: #fff;
        }
    .button-new {
        padding: 12px 17px;
        font-size: 18px;
        color: #fff;
    }
    .button-restore {
        background-color: #780320;
        color: #fff;
    }
    .button-restore:hover {
        background-color: #930628;
        color: #fff;
    }

    @media (max-width: 768px) {
        button.back-button { padding: 6px 10px; font-size: 0.9rem; }
    }    

    form {
        display: flex;
        flex-wrap: wrap;
        gap: 25px;
        justify-content: center;
    }    

    input[type="file"] {
        flex: 1 1 auto;
        max-width: 350px;
    }    

</style>  
  
<body>
    <h1 style="margin-top: 20px;">Gestión fichero de parámetros</h1>

    <button class="back-button" onclick="window.location.href='/index.htm'">← Volver</button>

    <div class="container">
        <h2>Carga de parámetros a la CCR:</h2>
        <form id="uploadForm" enctype="multipart/form-data" style="white-space: nowrap" >
            <input type="file" id="fileInput" name="file" accept=".json" required>
            <button type="button" class="button-flex button-import" onclick="uploadFile()">Import</button>
            <button type="button" class="button-flex button-new" onclick="openNewFile()">New</button>
        </form>
    </div>
    <h3>Fichero de Parámetros en la CCR: </h3>
    <table class="files-4-col" style="margin: 0 auto;">
        <thead><tr><th>Nombre</th><th>Tamaño</th><th>Timestamp</th><th>Acción</th></tr></thead>
        <tbody id="parmTableBody">
            <!-- Rows will be dynamically added here -->
        </tbody>
    </table>
    <h3>Fichero de Backup en la CCR:</h3>
    <table class="files-4-col" style="margin: 0 auto;">
        <thead><tr><th>Nombre</th><th>Tamaño</th><th>Timestamp</th><th>Acción</th></tr></thead>
        <tbody id="backupTableBody">
            <!-- Rows will be dynamically added here -->
        </tbody>    
    </table>    
    <script src="/funciones.js"></script>
    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) { alert("Por favor, seleccione un archivo para subir."); return; }
            // 1. Función auxiliar para leer y validar el archivo
            const readFileAndValidate = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const fileContent = event.target.result;
                        try {
                            JSON.parse(fileContent); // Validar sintaxis JSON
                            resolve(true); // Resuelve si la validación es correcta
                        } catch (e) {
                            console.error("Error de sintaxis JSON:", e);
                            alert(`Error de sintaxis JSON en el archivo: ${file.name}.\n\nPor favor, corrija el archivo antes de importarlo.`);
                            reject(new Error("JSON Syntax Error")); // Rechaza si falla la validación
                        }
                    };
                    reader.onerror = () => {
                        alert("Error al leer el archivo. Intente de nuevo.");
                        reject(new Error("File Read Error")); // Rechaza si falla la lectura
                    };
                    reader.readAsText(file);
                });
            };
            // 2. Ejecutar la lectura y validación (se detiene aquí hasta que se complete)
            try { await readFileAndValidate(file);
                } catch (error) { return; }    // Si hay error de lectura o sintaxis JSON, la función termina aquí
            const formData = new FormData();
            formData.append('file', file, '%PARMFILE%'); 
            if (confirm("¡Los parámetros actuales serán sustituidos por los de " + file.name + " ! ¿Continuar?")) {
                try {
                    const response = await fetch('/', {
                        method: 'POST',
                        body: formData
                    });
                    if (response.ok) {
                        if (confirm("Archivo subido correctamente. ¿Desea reiniciar el sistema para aplicar los cambios?")) {
                            window.location.href='/api/restart'; 
                        } else { location.reload(); }
                    } else { alert("Error al subir el archivo."); }
                } catch (error) {
                    console.error("Error al subir el archivo:", error);
                    alert("Ocurrió un error al subir el archivo.");
                }
            }
        }

        function openNewFile() {
            if (confirm("¿Desea crear un nuevo archivo de parámetros? (los actuales serán borrados)")) {
                window.open('parmfile_edit.htm?file=templateParm.json', '_self'); // Open in the same tab
            }
        }
    
        // Fetch and display the data when the page loads
        window.addEventListener("load", () => {
            // Usamos un requestAnimationFrame para POSPONER la modificación del DOM 
            // y permitir que el navegador termine sus tareas internas (incluyendo ThumbnailsChild.sys.mjs).
            window.requestAnimationFrame(() => {
                // --- Lógica para la Tabla de Parámetros ---
                apiGetJson('/api/list?file=' + encodeURIComponent('%PARMFILE%'))
                    .then(data => {
                        populateTable(data, "parmTableBody");
                    })
                    .catch(error => console.error("Error fetching parm file data:", error));
                // --- Lógica para la Tabla de Backup ---
                apiGetJson('/api/list?file=' + encodeURIComponent('%BACKUPFILE%'))
                    .then(data => {
                        populateTable(data, "backupTableBody");
                    })
                    .catch(error => console.error("Error fetching backup file data:", error));
            });
        });
    </script>
</body>
</html>
