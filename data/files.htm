<html>

<head>
  <title>Files</title>
  <meta name='viewport' content='user-scalable=yes,initial-scale=1.0,width=device-width'>
  <link Content-Type="text/css" href="/style_base.css" rel="stylesheet" />
  <link Content-Type="text/css" href="/style_tableFiles.css" rel="stylesheet" />
  <script src="/funciones.js"></script>
  <script>
    // Si se llamo con ?style=cards, cargar la hoja de estilo correspondiente
      const parametros = new URLSearchParams(window.location.search);
      const style = parametros.get('style');
      let hojaDeEstilo;
      if (style === 'cards') {
          hojaDeEstilo = '/style_datacard.css';
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = hojaDeEstilo;
          document.head.appendChild(link);
      }
  </script>
</head>

</body>

  <h1 style="margin-top: 20px;">Files on server</h1>

    <h3>These files are available on the server to be opened, downloaded or delete: </h3>
      <table style="margin: 0 auto;">  <!-- tabla centrada -->
          <thead style="background-color: #9ee0eb;">
          <tr>
          <th>Filename</th>
          <th style="text-align: center;">Size</th>
          <th style="text-align: center;">Timestamp</th>
          <th style="text-align: center;">Action</th>
          </tr>
          </thead>
          <tbody id="filesTableBody">
          <!-- Rows will be dynamically added here -->
          </tbody>
      </table>
  
  <script>

    // Fetch and display the data when the page loads
    window.addEventListener("load", () => {
      // Retrieve query parameters from the URL
      const queryParams = new URLSearchParams(window.location.search);
      console.log("Query Parameters:", Object.fromEntries(queryParams.entries()));
      const dir = queryParams.get("dir") || "/"; // Get 'directory passed or default to root
      apiGetJson(`/api/list?dir=${encodeURIComponent(dir)}`)
        .then(data => {
          populateTable(data, "filesTableBody");
        })
        .catch(error => console.error("Error fetching file data:", error));
    });

  </script>
</body>

</html>
