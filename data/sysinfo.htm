<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
            color: #333;
        }
        td {
            color: #555;
        }
    </style>
</head>
<body>
    <h1>System Information</h1>
    <table>
        <thead>
            <tr>
                <th>Key</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody id="sysInfoTableBody">
            <!-- Rows will be dynamically added here -->
        </tbody>
    </table>

    <script>
        fetch('/$sysinfo')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(sysInfo => {
                const tableBody = document.getElementById("sysInfoTableBody");
                if (Object.keys(sysInfo).length === 0) {
                    const row = document.createElement("tr");
                    const cell = document.createElement("td");
                    cell.colSpan = 2;
                    cell.textContent = "No data available";
                    cell.style.textAlign = "center";
                    row.appendChild(cell);
                    tableBody.appendChild(row);
                } else {
                    Object.keys(sysInfo).forEach(key => {
                        const row = document.createElement("tr");

                        const keyCell = document.createElement("td");
                        keyCell.textContent = key;
                        row.appendChild(keyCell);

                        const valueCell = document.createElement("td");
                        valueCell.textContent = sysInfo[key];
                        row.appendChild(valueCell);

                        tableBody.appendChild(row);
                    });
                }
            })
            .catch(error => {
                console.error('Error fetching system info:', error);
                const tableBody = document.getElementById("sysInfoTableBody");
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 2;
                cell.textContent = "Error fetching system info";
                cell.style.textAlign = "center";
                row.appendChild(cell);
                tableBody.appendChild(row);
            });
    </script>
</body>
</html>
