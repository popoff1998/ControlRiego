<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Histórico de Riegos y Grupos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style_base.css">
  <link rel="stylesheet" href="style_tableFiles.css">
  <style>
    .table-container { max-width: 900px; margin: auto; }
    h2 { margin-top: 2em; margin-bottom: 0.5em; }
    table.files-table th, table.files-table td {
      text-align: center;
      vertical-align: middle;
    }
    @media (max-width: 600px) {
      .table-container { max-width: 100%; }
      table { font-size: 0.95em; }
      th, td { padding: 4px; }
    }
    .btn-log {
      background: #2e8e95;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 1em;
    }
    .btn-log:hover {
      background: #1565c0;
    }
  </style>
</head>
<body>
    <div class="table-container">
    <h1 style="margin-top: 20px;">Últimos riegos desde CCR registrados</h1>
    <h2>Zonas</h2>
    <table class="files-table" id="tablaRiegos">
      <thead>
        <tr>
          <th>Zona</th>
          <th>Inicio</th>
          <th>Final</th>
          <th>Minutos</th>
          <th>Histórico</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Grupos</h2>
    <table class="files-table" id="tablaGrupos">
      <thead>
        <tr>
          <th>Grupo</th>
          <th>Inicio</th>
          <th>Final</th>
          <th>Minutos</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script>
    // Formatea timestamp a "AA/MM/DD hh:mm"
    function formatDate(ts) {
      if (!ts || ts === 0) return "-";
      const d = new Date(ts * 1000);
      const y = String(d.getFullYear()).slice(-2);
      const m = ('0' + (d.getMonth() + 1)).slice(-2);
      const day = ('0' + d.getDate()).slice(-2);
      const h = ('0' + d.getHours()).slice(-2);
      const min = ('0' + d.getMinutes()).slice(-2);
      return `${y}/${m}/${day} ${h}:${min}`;
    }

    // ts ya es hora local en segundos
    // Creamos un objeto Date en UTC y extraemos los componentes como si fueran locales
    // Para evitar el offset, usamos los métodos getUTC* en vez de get*
    function formatDateLocal(ts) {
      if (!ts || ts === 0) return "-";
      const d = new Date(ts * 1000);
      const y = d.getUTCFullYear();
      const m = ('0' + (d.getUTCMonth() + 1)).slice(-2);
      const day = ('0' + d.getUTCDate()).slice(-2);
      const h = ('0' + d.getUTCHours()).slice(-2);
      const min = ('0' + d.getUTCMinutes()).slice(-2);
      return `${day}/${m}/${y} - ${h}:${min}`;
    }

    // Convierte segundos a minutos (redondeo a minutos, 1 decimal si < 1 min)
    function formatMinutes(segundos) {
      const minutos = segundos / 60;
      if (minutos < 1 && segundos > 0) {
        return minutos.toFixed(1);
      }
      return Math.round(minutos);
    }

    // Carga y muestra tabla de riegos
    fetch('lastRiegos.json')
      .then(r => r.json())
      .then(data => {
        const tbody = document.querySelector('#tablaRiegos tbody');
        data.lastRiegos.forEach((riego, zoneIndex) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td data-label="Zona">${zoneIndex + 1}</td>
            <td data-label="Inicio">${formatDateLocal(riego.inicio)}</td>
            <td data-label="Final">${formatDateLocal(riego.final)}</td>
            <td data-label="Minutos">${formatMinutes(riego.total)}</td>
            <td data-label="LOG">
              <button class="btn-log" onclick="showZONElog(${zoneIndex + 1})">LOG</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });

    // Carga y muestra tabla de grupos
    fetch('lastGrupos.json')
      .then(r => r.json())
      .then(data => {
        const tbody = document.querySelector('#tablaGrupos tbody');
        data.lastGrupos.forEach((grupo, groupIndex) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td data-label="Grupo">${groupIndex + 1}</td>
            <td data-label="Inicio">${formatDateLocal(grupo.inicio)}</td>
            <td data-label="Final">${formatDateLocal(grupo.final)}</td>
            <td data-label="Minutos">${formatMinutes(grupo.total)}</td>
          `;
          tbody.appendChild(tr);
        });
      });

    // Función para mostrar el log de una zona (por número de zona)
    function showZONElog(znumber) {
      window.location.href = `showLog.htm?zona=${znumber}`;
    }
  </script>
</body>
</html>
