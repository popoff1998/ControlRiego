<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Histórico de Riegos y Grupos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style_base.css">
  <link rel="stylesheet" href="/style_botones.css">
  <link rel="stylesheet" href="/style_tableFiles.css">
<style>
  .table-container { max-width: 900px; margin: auto; }
  h2 { margin-top: 2em; margin-bottom: 0.5em; }
  table.files-table th, table.files-table td { text-align: center; vertical-align: middle; }
  .info-flotante { 
    position: absolute; background: #333; color: #fff; padding: 8px; border-radius: 6px; 
    font-size: .85em; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.4); pointer-events: none; 
    line-height: 1.4; transition: opacity .4s ease; opacity: 0; visibility: hidden;}
  .info-flotante.show { opacity: 1; visibility: visible;}    
  .info-flotante b { color: #2ecc71; }
  @media (max-width: 600px) {
    .table-container { max-width: 100%; } table { font-size: 0.95em; } th, td { padding: 4px; } h2 { margin-top: 1em; }
  }
</style>
</head>
<body>
  <h1 style="margin-top: 20px;">Últimos riegos registrados</h1>
  <div class="table-container">
    <h2>Zonas</h2>
    <table class="files-table">
      <thead><tr><th>Zona</th><th>Inicio</th><th>Final</th><th>Minutos</th><th>Histórico</th></tr></thead>
      <tbody id="tablaRiegos"></tbody>
    </table>

    <h2>Grupos</h2>
    <table class="files-table">
      <thead><tr><th>Grupo</th><th>Inicio</th><th>Final</th><th>Minutos</th></tr></thead>
      <tbody id="tablaGrupos"></tbody>
    </table>
  </div>

<script src="/funciones.js"></script>
<script>
const showZONElog = (z) => window.location.href = `showLog.htm?zona=${z}`;

window.addEventListener("load", async () => {
  const infoBox = document.createElement("div");
  infoBox.className = "info-flotante";
  document.body.appendChild(infoBox);

  const showInfo = (e, txt) => {
    if (infoBox.timer) clearTimeout(infoBox.timer);
    infoBox.innerHTML = txt;
    infoBox.style.left = `${e.pageX + 10}px`;
    infoBox.style.top = `${e.pageY + 10}px`;
    infoBox.classList.add("show");
    const hide = () => infoBox.classList.remove("show");
    e.target.onmouseleave = hide;
    infoBox.timer = setTimeout(hide, 2500);
  };

  try {
    const config = await getServerConfig();
    const [riegosRes, gruposRes, params] = await Promise.all([
      apiGetJson(config.lastRiegos),
      apiGetJson(config.lastGrupos),
      apiGetJson(config.parmFile).catch(() => ({}))
    ]);
    const renderTable = (idBody, list, type) => {
      const isZona = type === 'zona';
      document.getElementById(idBody).innerHTML = list.map((item, pos) => `
        <tr>
          <td><span class="${isZona ? 'orla-v' : 'orla-a'} clicable" data-pos="${pos}">${pos + 1}</span></td>
          <td>${formatDateLocal(item.inicio)}</td>
          <td>${formatDateLocal(item.final)}</td>
          <td>${formatMinutes(item.total)}</td>
          ${isZona ? `<td><button class="btn-log" onclick="showZONElog(${pos + 1})">LOG</button></td>` : ''}
        </tr>`).join('');
      document.querySelectorAll(`#${idBody} .clicable`).forEach(el => {
        el.onclick = (e) => {
          const pos = el.dataset.pos;
          const html = isZona 
            ? `<b>${params.botones[pos].nombre}</b>`
            : `<b>${params.grupos[pos].desc}</b><br>Zonas: ${params.grupos[pos].zonas.join(", ")}`;
          showInfo(e, html);
        };
      });
    };

    renderTable('tablaRiegos', riegosRes.lastRiegos, 'zona');
    renderTable('tablaGrupos', gruposRes.lastGrupos, 'grupo');

  } catch (e) { console.error("Error:", e); }
});
</script>
</body>
</html>
